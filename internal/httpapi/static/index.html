<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校准追溯站</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.top{background:#13294b;color:white;padding:22px 30px}h1{margin:0;font-size:26px}.wrap{padding:22px 30px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:8px;padding:9px 13px;background:#2257a6;color:white;cursor:pointer}button.secondary{background:#60708a}button.danger{background:#9b2c2c}button:hover{filter:brightness(1.08)}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #c8d0dd;border-radius:8px;padding:9px;font:inherit}textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:13px}.card{background:white;border:1px solid #dde3ed;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px #1b2a4a14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field label{display:block;font-weight:600;margin-bottom:5px;font-size:13px}table{border-collapse:collapse;width:100%;background:white}th,td{border-bottom:1px solid #e2e7f0;text-align:left;padding:8px;vertical-align:top}th{background:#eef3fb}.hidden{display:none}.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#e7eefc;color:#174ea6;font-size:12px}.ok{color:#17663b}.bad{color:#9b2c2c}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}pre{white-space:pre-wrap;background:#0f172a;color:#dbeafe;padding:12px;border-radius:8px;overflow:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#667085;font-size:13px}
</style>
</head>
<body>
<header class="top"><h1>校准追溯站</h1><div class="muted" style="color:#c9d8ef">设备、参考点、版本化曲线、原始读数与冻结结果的本地追溯服务</div></header>
<main class="wrap">
<nav class="tabs">
<button data-tab="register">登记</button><button data-tab="curves">曲线与覆盖</button><button data-tab="readings">导入读数</button><button data-tab="results">结果对照</button><button data-tab="compare">历史比较</button><button data-tab="data">导出导入</button>
</nav>
<section id="register" class="tab">
<div class="grid"><div class="card"><h3>登记单位</h3><div class="field"><label>JSON</label><textarea id="unitJson">{"id":"C","name":"Celsius","dimension":"temperature","factor":1,"offset":0}</textarea></div><p><button onclick="post('/api/units','unitJson')">保存单位</button></p></div>
<div class="card"><h3>登记设备</h3><div class="field"><label>JSON</label><textarea id="deviceJson">{"id":"dev-1","name":"温控探头 1","input_unit_id":"C","output_unit_id":"C"}</textarea></div><p><button onclick="post('/api/devices','deviceJson')">保存设备</button></p></div>
<div class="card"><h3>登记参考点</h3><div class="field"><label>JSON</label><textarea id="refJson">{"id":"ref-1","device_id":"dev-1","name":"冰点","input_value":0,"input_unit_id":"C","output_value":0,"output_unit_id":"C","taken_at":"2026-01-01T00:00:00Z"}</textarea></div><p><button onclick="post('/api/references','refJson')">保存参考点</button></p></div></div>
</section>
<section id="curves" class="tab hidden"><div class="card"><h3>新建曲线版本</h3><textarea id="curveJson"></textarea><p><button onclick="post('/api/curves','curveJson',201)">创建草稿</button> <button class="secondary" onclick="fillCurveTemplate()">填入示例</button></p></div><div class="card"><h3>曲线列表、覆盖与间隙</h3><div id="curveList"></div></div><div class="card"><h3>编辑所选曲线（乐观锁）</h3><textarea id="curveEdit"></textarea><p><button onclick="updateCurve()">保存修改</button> <button class="secondary" onclick="publishCurve()">发布</button> <button onclick="cloneCurve()">克隆为新草稿</button></p></div></section>
<section id="readings" class="tab hidden"><div class="card"><h3>批量导入读数</h3><textarea id="readingJson"></textarea><p><button onclick="importReadings()">导入并冻结结果</button> <button class="secondary" onclick="fillReadingTemplate()">填入示例</button></p><pre id="importResult"></pre></div></section>
<section id="results" class="tab hidden"><div class="card"><div class="row"><input id="traceDevice" placeholder="设备 ID，例如 dev-1" style="max-width:240px"><input id="traceSample" placeholder="样本 ID，例如 s-1" style="max-width:240px"><button onclick="traceResult()">追溯</button></div><pre id="traceResult"></pre></div><div class="card"><h3>原始值 / 校准值</h3><div id="resultTable"></div></div></section>
<section id="compare" class="tab hidden"><div class="card"><h3>比较两个曲线版本（不改写历史）</h3><textarea id="compareJson"></textarea><p><button onclick="post('/api/compare','compareJson')">比较</button> <button class="secondary" onclick="fillCompareTemplate()">填入示例</button></p><pre id="compareResult"></pre></div></section>
<section id="data" class="tab hidden"><div class="card"><h3>数据文件</h3><p><a href="/api/export"><button type="button">导出 JSON</button></a></p><h3>导入完整快照</h3><input type="file" id="importFile" accept="application/json"><p><button onclick="importSnapshot()">校验并导入</button></p><pre id="dataResult"></pre></div></section>
</main>
<script>
let state={};
function show(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.getElementById(tab).class.remove('hidden')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
async function api(path,options){let r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},options));let text=await r.text();let data=text?JSON.parse(text):null;if(!r.ok)throw new Error(data.error||r.status);return data}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function post(path,id,status=200){try{let d=await api(path,{method:'POST',body:document.getElementById(id).value});document.getElementById(id+'-result') && (document.getElementById(id+'-result').textContent=JSON.stringify(d,null,2));await refresh();alert('已保存')}catch(e){alert(e.message)}}
async function refresh(){state=await api('/api/state');renderCurves();renderResults()}
function segmentTemplate(){return {segments:[{id:'seg-low',kind:'linear',x_min:0,x_max:50,min_inclusive:true,max_inclusive:false,points:[{x:0,y:0},{x:50,y:52}],uncertainty:0.2},{id:'seg-high',kind:'polynomial',x_min:50,x_max:100,min_inclusive:true,max_inclusive:true,coefficients:[2,1,0],uncertainty:0.3}]}}
function fillCurveTemplate(){document.getElementById('curveJson').value=JSON.stringify(Object.assign({device_id:'dev-1',name:'v1 linear+poly',input_unit_id:'C',output_unit_id:'C',extrapolation:false,extra_uncertainty:0,valid_from:'2026-01-01T00:00:00Z',valid_until:'2027-01-01T00:00:00Z',reference_ids:['ref-1']},segmentTemplate()),null,2)}
function fillReadingTemplate(){document.getElementById('readingJson').value=JSON.stringify({rows:[{device_id:'dev-1',sample_id:'s-1',raw_value:25,raw_unit_id:'C',device_time:'2026-02-01T10:00:00Z',received_at:'2026-02-01T10:05:00Z'}]},null,2)}
function fillCompareTemplate(){let ids=state.curves.map(x=>x.id);document.getElementById('compareJson').value=JSON.stringify({left_curve_id:ids[0]||'curve-1',right_curve_id:ids[1]||'curve-2',device_id:'dev-1',sample_ids:['s-1']},null,2)}
function renderCurves(){let h='<table><tr><th>ID</th><th>设备</th><th>名称</th><th>状态</th><th>版本</th><th>确认时间</th><th>指纹</th><th></th></tr>';state.curves.forEach(c=>{h+=`<tr><td>${esc(c.id)}</td><td>${esc(c.device_id)}</td><td>${esc(c.name)}</td><td><span class="pill">${esc(c.status)}</span></td><td>${c.revision}</td><td>${esc(c.confirmed_at)}</td><td class="mono">${esc(c.fingerprint.slice(0,16))}</td><td><button class="secondary" onclick="editCurve('${esc(c.id)}')">编辑</button> <button class="secondary" onclick="coverage('${esc(c.id)}')">覆盖</button></td></tr>`});document.getElementById('curveList').innerHTML=h+'</table>'}
async function editCurve(id){let c=state.curves.find(x=>x.id===id);document.getElementById('curveEdit').value=JSON.stringify({expected_revision:c.revision,curve:{name:c.name,input_unit_id:c.input_unit_id,output_unit_id:c.output_unit_id,segments:c.segments,extrapolation:c.extrapolation,extra_uncertainty:c.extra_uncertainty,valid_from:c.valid_from,valid_until:c.valid_until,reference_ids:c.reference_ids}},null,2);document.getElementById('curveEdit').dataset.id=id}
async function updateCurve(){let id=document.getElementById('curveEdit').dataset.id;try{await api('/api/curves/'+id,{method:'PUT',body:document.getElementById('curveEdit').value});await refresh();alert('已更新')}catch(e){alert(e.message)}}
async function publishCurve(){let id=document.getElementById('curveEdit').dataset.id;let body=JSON.stringify({expected_revision:JSON.parse(document.getElementById('curveEdit').value).expected_revision,confirmed_at:new Date().toISOString()});try{await api('/api/curves/'+id+'/publish',{method:'POST',body});await refresh();alert('已发布')}catch(e){alert(e.message)}}
async function cloneCurve(){let id=document.getElementById('curveEdit').dataset.id;try{await api('/api/curves/'+id+'/clone',{method:'POST',body:'{}'});await refresh();alert('已克隆')}catch(e){alert(e.message)}}
async function coverage(id){try{let d=await api('/api/curves/'+id+'/coverage');alert(JSON.stringify(d.coverage,null,2))}catch(e){alert(e.message)}}
async function importReadings(){try{let d=await api('/api/readings/import',{method:'POST',body:document.getElementById('readingJson').value});document.getElementById('importResult').textContent=JSON.stringify(d,null,2);await refresh()}catch(e){alert(e.message)}}
function renderResults(){let h='<table><tr><th>设备</th><th>样本</th><th>原始值</th><th>原始时间/接收时间</th><th>校准值±不确定度</th><th>区段</th><th>曲线</th></tr>';state.readings.forEach(r=>{let q=state.results.find(x=>x.device_id===r.device_id&&x.sample_id===r.sample_id);h+=`<tr><td>${esc(r.device_id)}</td><td>${esc(r.sample_id)}</td><td>${r.raw_value} ${esc(r.raw_unit_id)}</td><td>${esc(r.device_time)}<br>${esc(r.received_at)}</td><td>${q?q.calibrated_value+' ± '+q.uncertainty.combined+' '+esc(q.output_unit_id):'无冻结结果'}</td><td class="mono">${q?esc(q.segment_id+' '+q.interval):''}</td><td class="mono">${q?esc(q.selection_reason.curve_id):''}</td></tr>`});document.getElementById('resultTable').innerHTML=h+'</table>'}
async function traceResult(){let p=new URLSearchParams({device_id:document.getElementById('traceDevice').value,sample_id:document.getElementById('traceSample').value});try{document.getElementById('traceResult').textContent=JSON.stringify(await api('/api/trace?'+p),null,2)}catch(e){document.getElementById('traceResult').textContent=e.message}}
async function importSnapshot(){let f=document.getElementById('importFile').files[0];if(!f)return alert('选择文件');let text=await f.text();try{let d=await api('/api/import-data',{method:'POST',body:text});document.getElementById('dataResult').textContent=JSON.stringify(d,null,2);await refresh()}catch(e){document.getElementById('dataResult').textContent=e.message}}
refresh().catch(()=>{});fillReadingTemplate();fillCompareTemplate();
</script>
</body></html>
